/* ===== Apple Music風：テーマ詳細画面 ===== */

.album-page {
  min-height: 100dvh;
  background: linear-gradient(
    180deg,
    #38312f 0%,
    #292525 45%,
    #171515 100%
  );
}

.album-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 20px;
}

.album-back {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 1px solid #ffffff30;
  background: #ffffff10;
  color: white;
  font-size: 30px;
}

.album-menu {
  border: 1px solid #ffffff30;
  border-radius: 24px;
  background: #ffffff10;
  color: white;
  padding: 10px 18px;
  font-size: 22px;
}

.album-cover {
  width: min(70vw, 320px);
  height: min(70vw, 320px);
  margin: 25px auto 0;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 15px 35px #0005;
}

.album-cover img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.album-info {
  text-align: center;
  padding: 22px 20px 0;
}

.album-title {
  font-size: 30px;
  font-weight: 750;
  margin: 0 0 6px;
}

.album-description {
  color: #d1caca;
  font-size: 16px;
  margin: 0;
}

.album-actions {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding: 24px 20px;
}

.album-primary {
  border: 0;
  border-radius: 28px;
  background: #fff;
  color: #242020;
  padding: 13px 30px;
  font-weight: 700;
}

.album-round {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: 0;
  background: #ffffff20;
  color: white;
  font-size: 24px;
}

.album-notes {
  padding: 0 20px;
}

.album-note {
  display: flex;
  align-items: center;
  min-height: 62px;
  border-top: 1px solid #ffffff24;
  gap: 16px;
}

.album-number {
  width: 22px;
  text-align: center;
  color: #aaa;
  flex-shrink: 0;
}

.album-note-title {
  flex: 1;
  min-width: 0;
  font-size: 17px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.album-note-menu {
  background: none;
  border: 0;
  color: #ccc;
  font-size: 22px;
  padding: 10px;
}

/* ===== アルバムカバーの表示修正 ===== */

.album-cover {
  width: min(78vw, 340px);
  height: auto;
  aspect-ratio: 1 / 1;
  margin: 25px auto 0;
  padding: 0;
  overflow: hidden;
  border-radius: 12px;
  display: block;
  box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
}

.album-cover > .cover {
  display: block;
  width: 100%;
  height: 100%;
  aspect-ratio: 1 / 1;
  margin: 0;
  padding: 0;
  border-radius: 0;
  object-fit: cover;
}

.album-cover > .cover.placeholder {
  display: grid;
  place-items: center;
}

/* ===== カバー画像に合わせた背景 ===== */

.album-page {
  --album-color: 65, 75, 105;

  background:
    linear-gradient(
      180deg,
      rgba(var(--album-color), 0.65) 0%,
      rgba(var(--album-color), 0.35) 38%,
      #171515 85%
    );

  min-height: 100dvh;
  padding-bottom: 30px;
}
/* ===== メモの長押しドラッグ ===== */

.album-note {
  position: relative;
  user-select: none;
  -webkit-user-select: none;
  touch-action: pan-y;
}

.album-note.dragging {
  background: rgba(255, 255, 255, 0.18);
  border-radius: 10px;
  opacity: 0.95;
  transform: translateY(var(--drag-y, 0px)) scale(1.03);
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
  z-index: 20;
  pointer-events: none;
}

.album-note.drag-over {
  border-top: 2px solid #ff375f;
}

.album-note-title {
  cursor: grab;
}

.album-note.dragging .album-note-title {
  cursor: grabbing;
}

/* ===== 並べ替えアニメーション ===== */

.album-note {
  transition:
    transform 0.18s ease,
    background 0.18s ease,
    box-shadow 0.18s ease;
}

.album-note.sort-shift-up {
  transform: translateY(-100%);
}

.album-note.sort-shift-down {
  transform: translateY(100%);
}

.album-note.dragging {
  transition:
    background 0.18s ease,
    box-shadow 0.18s ease;
}

/* ホーム画面の横スクロール余白 */
.rail,
.cardgrid{

}
